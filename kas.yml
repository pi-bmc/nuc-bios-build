# kas configuration for the NUC UEFI-driver build.
# Usage: kas build kas.yml   -> builds standalone UEFI .efi drivers under
#        build/tmp/deploy/images/nuc5i7ryh/efi-drivers/
# These are loaded on the NUC's stock (locked) BIOS from a USB/FAT volume via a
# Driver#### load option (efibootmgr --driver) -- they are NOT flashed into
# firmware. See README.md.
# Install kas: pip3 install kas

header:
  version: 14

machine: nuc5i7ryh
distro: poky
target: edk2-efi-drivers

build_system: openembedded

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  # Local layer (inside this repo)
  meta-nuc-bios:
    path: meta-nuc-bios
    layers:
      .:

local_conf_header:
  nuc-bios: |
    MACHINE = "nuc5i7ryh"
    DISTRO = "poky"
    BB_NUMBER_THREADS = "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE = "-j ${@oe.utils.cpu_count()}"
    CONNECTIVITY_CHECK_URIS = ""
    # Shared download and sstate directories (override per user if desired).
    DL_DIR = "/opt/yocto/downloads"
    SSTATE_DIR = "/opt/yocto/sstate-cache"
