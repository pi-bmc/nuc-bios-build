BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nuc-bios"
BBFILE_PATTERN_nuc-bios = "^${LAYERDIR}/"
BBFILE_PRIORITY_nuc-bios = "10"

LAYERSERIES_COMPAT_nuc-bios = "scarthgap"

# coreboot builds its own i386 cross toolchain (crossgcc) and, for
# libgfxinit, needs a host Ada compiler; the crossgcc bootstrap and the edk2
# payload fetch also shell out to curl/wget. Make these visible inside
# bitbake's isolated environment when present on the host (gnat comes from
# the distro's gcc-ada package).
HOSTTOOLS_NONFATAL += "curl wget gnat gnatbind gnatlink gnatmake"

# iPXE derives each ROM's link-time build id with
#   BUILD_ID_CMD = cat $^ | cksum | awk '{print $1}'
# (Makefile.housekeeping). cksum is coreutils but is not in poky's HOSTTOOLS,
# so inside bitbake's sanitised PATH the command produces nothing and the link
# becomes "--defsym _build_id=", which ld rejects with a bare
# "--defsym:0: syntax error". Fatal rather than NONFATAL: a missing cksum
# should be reported by the sanity check, not as that.
HOSTTOOLS += "cksum"

# coreboot's payloads/external/edk2 "checktools" target hard-requires
# imagemagick's `convert` -- it probes with `convert -size 1x1 xc: test.png` and
# aborts the whole payload build if that fails, whether or not a bootsplash is
# configured (EDK2_BOOTSPLASH_FILE). Without this the failure surfaces as a bare
#     EDK2: Checking imagemagick: Not found!
#     make: *** [payloads/external/Makefile.mk: build/UEFIPAYLOAD.fd] Error 2
# Fatal rather than NONFATAL so the sanity check names the missing package up
# front. meta-oe does carry imagemagick-native, but building it just to satisfy
# a 1x1-pixel probe is not worth the dependency tree.
HOSTTOOLS += "convert"
# ImageMagick 7 renames convert -> magick and treats convert as legacy; keep it
# visible too so a host that has dropped the compatibility name still works.
HOSTTOOLS_NONFATAL += "magick"

# edk2's BaseTools builds VfrCompile, whose vendored Pccts/antlr makefile uses a
# bare `cc` (and `c++`) rather than $(CC). bitbake's sanitised PATH exposes only
# gcc/g++, so the nested make dies five levels deep with a bare
#     cc: No such file or directory
#     make[5]: *** [makefile:215: antlr.o] Error 127
# When the payload was a Yocto recipe this was handled by invoking
# `oe_runmake -C BaseTools CC=gcc CXX=g++`, but coreboot's
# payloads/external/edk2 Makefile drives BaseTools itself and the assignment
# does not survive to the innermost make. Exposing the conventional names is the
# reliable fix. Both are gcc symlinks on any normal toolchain install.
HOSTTOOLS += "cc c++"
