# Multiconfig for the bootable flasher live ISO.
#
# Selected by BBMULTICONFIG = "flasher" (kas.yml). The coreboot ROM is built
# by the default multiconfig (machine nuc5i7ryh); this one builds a
# intel-corei7-64 Linux live image that runs on the NUC itself and carries
# flashrom + that ROM (see nuc-coreboot-rom, which pulls it across the
# multiconfig boundary via do_install[mcdepends]).
#
# intel-corei7-64 (meta-intel) is the real-hardware BSP -- its linux-yocto
# carries the drivers the NUC needs to boot this image off JetKVM virtual
# media and reach its SPI flash: xhci/usb-storage (the emulated CD/USB),
# usb HID (the emulated keyboard), ahci/nvme, e1000e (I218-V, for scp'ing
# the stock backup off), i915 (console).

MACHINE = "intel-corei7-64"
DISTRO = "poky"

# Keep this image's output separate from the coreboot (default mc) tree.
# TOPDIR is shared, so nuc-coreboot-rom reads the ROM from ${TOPDIR}/tmp.
TMPDIR = "${TOPDIR}/tmp-flasher"
