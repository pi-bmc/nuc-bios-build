#@TYPE: Machine
#@NAME: Intel NUC5i7RYH (Rock Canyon)
#@DESCRIPTION: Intel NUC5i7RYH: soldered Broadwell-U i7-5557U (Iris 6100),
# Wildcat Point-LP PCH, Nuvoton NCT5577D SIO, I218-V GbE, M.2 NVMe, 8 MiB
# Macronix MX25L6405 SPI flash. This machine exists to build the host BIOS
# (coreboot + payload) under the nuc-bios multiconfig, not an OS image --
# the only OS-side artifacts are the LinuxBoot payload kernel and u-root.

require conf/machine/include/x86/tune-corei7.inc
DEFAULTTUNE = "corei7-64"

MACHINE_FEATURES = "acpi pci serial usbhost"

# linux-dummy, not linux-linuxboot: no OS kernel is built for this machine
# (the LinuxBoot payload kernel is consumed by the coreboot recipe under its
# explicit recipe name, never via virtual/kernel), and the preference must
# name an EXISTING virtual/kernel recipe anyway or bitbake drops linux-dummy
# from every provider list -- with no eligible PACKAGES_DYNAMIC
# "^kernel-module-.*" provider left, the image recipes' dependency graphs
# (util-linux's kernel-module-* RDEPENDS, via the ptest chain) become
# unresolvable and the wic images refuse to build.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
KERNEL_IMAGETYPE = "bzImage"

SERIAL_CONSOLES = "115200;ttyS0"

# No rootfs image is built in this multiconfig; the deliverable is
# coreboot-nuc5i7ryh.rom in DEPLOY_DIR_IMAGE (see nuc-bios-seed).
IMAGE_FSTYPES = "tar.xz"
