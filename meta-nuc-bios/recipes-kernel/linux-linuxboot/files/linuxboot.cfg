# LinuxBoot payload kernel fragment for the NUC5i7RYH: boot the real OS via
# kexec from u-root; drivers cover only what the NUC exposes for that job.

# kexec is the whole point
CONFIG_KEXEC=y
CONFIG_KEXEC_FILE=y

# coreboot integration: coreboot table parsing, cbmem console, framebuffer
# handed over from libgfxinit
CONFIG_GOOGLE_FIRMWARE=y
CONFIG_GOOGLE_COREBOOT_TABLE=y
CONFIG_GOOGLE_MEMCONSOLE_COREBOOT=y
CONFIG_GOOGLE_CBMEM=y
CONFIG_FB_SIMPLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_SYSFB_SIMPLEFB=y

# The initramfs is supplied by coreboot (CONFIG_LINUX_INITRD), not built in
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_XZ=y

# Storage: M.2 NVMe + SATA (RYH takes a 2.5" drive)
CONFIG_BLK_DEV_NVME=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y

# Network: I218-V GbE for netboot/ssh from u-root
CONFIG_E1000E=y

# USB: keyboard for interactive u-root use
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_HID=y
CONFIG_USB_STORAGE=y

# Filesystems u-root needs to reach kernels on disk
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# fTPM via the ME's PTT (CRB start method)
CONFIG_TCG_TPM=y
CONFIG_TCG_CRB=y

# Keep it lean: no modules -- everything the payload needs is built in
CONFIG_MODULES=n
