BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nuc-bios"
BBFILE_PATTERN_nuc-bios = "^${LAYERDIR}/"
BBFILE_PRIORITY_nuc-bios = "10"

LAYERSERIES_COMPAT_nuc-bios = "scarthgap"

# coreboot builds its own i386 cross toolchain (crossgcc) and, for
# libgfxinit, needs a host Ada compiler; the crossgcc bootstrap and the edk2
# payload fetch also shell out to curl/wget. Make these visible inside
# bitbake's isolated environment when present on the host (gnat comes from
# the distro's gcc-ada package).
HOSTTOOLS_NONFATAL += "curl wget gnat gnatbind gnatlink gnatmake"

# iPXE derives each ROM's link-time build id with
#   BUILD_ID_CMD = cat $^ | cksum | awk '{print $1}'
# (Makefile.housekeeping). cksum is coreutils but is not in poky's HOSTTOOLS,
# so inside bitbake's sanitised PATH the command produces nothing and the link
# becomes "--defsym _build_id=", which ld rejects with a bare
# "--defsym:0: syntax error". Fatal rather than NONFATAL: a missing cksum
# should be reported by the sanity check, not as that.
HOSTTOOLS += "cksum"
