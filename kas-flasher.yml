# Build the bootable flasher live ISO (intel-corei7-64), which carries flashrom
# and the coreboot ROM. Layers/multiconfig come from kas.yml.
#   kas build kas-flasher.yml
# Output: build/tmp-flasher/deploy/images/intel-corei7-64/nuc-flasher-image-*.iso
header:
  version: 14
  includes:
    - kas.yml

target: mc:flasher:nuc-flasher-image
