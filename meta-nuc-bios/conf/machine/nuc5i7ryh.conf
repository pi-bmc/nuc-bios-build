#@TYPE: Machine
#@NAME: Intel NUC5i7RYH (Rock Canyon)
#@DESCRIPTION: Intel NUC5i7RYH: soldered Broadwell-U i7-5557U, Wildcat
# Point-LP PCH, I218-V GbE, 8 MiB Macronix MX25L6405 SPI flash. This machine
# exists only to give bitbake a valid x86-64 target; the deliverable is a set
# of standalone UEFI .efi drivers (edk2-efi-drivers) built by EDK2's own X64
# toolchain -- no OS image or kernel is produced.

require conf/machine/include/x86/tune-corei7.inc
DEFAULTTUNE = "corei7-64"

MACHINE_FEATURES = "acpi pci serial usbhost"
